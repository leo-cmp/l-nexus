name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # setup-node nao instala dependencia, e as suites .mjs importam `yaml`.
      # Sem isto o `npm test` morre em module-not-found no push da tag, com o
      # publish logo atras.
      - run: npm ci

      - run: npm test

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
