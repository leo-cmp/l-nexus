cli_runners:
  # Interfaces verificadas contra os binarios instalados em 2026-08-31 com
  # `--help`. Ao trocar de CLI ou de versao, confirme antes de editar: um
  # template errado trava a delegacao (modo interativo que nao retorna) ou
  # credita um effort que a CLI nao aplica.
  #
  # argv         modo nao interativo, uma tacada so (gate automatico)
  # interactive  sessao que continua aberta, para o Orchestrator conduzir
  # autonomy     auto-aprovacao de ferramentas. NUNCA entra no argv padrao:
  #              e opt-in por invocacao, porque desliga a confirmacao da
  #              propria CLI e contraria a regra do l-nexus de que comando
  #              destrutivo exige confirmacao humana. Evite em R3.
  codex:
    binary: "codex"
    # `codex exec ... -` le as instrucoes do stdin.
    argv: ["exec", "--model", "{model}", "-"]
    prompt_delivery: stdin
    interactive:
      # Sem subcomando as opcoes vao para a CLI interativa; PROMPT e posicional.
      supported: true
      argv: ["--model", "{model}", "{prompt}"]
    autonomy:
      supported: true
      argv: ["--dangerously-bypass-approvals-and-sandbox"]
    default_model: "gpt-5.6-sol"
    provides:
      providers: [openai]
      models: []
    effort:
      # Nao verificado nesta versao da CLI. Deixe false ate confirmar.
      supported: false
      argv: []
      mapping: {}
  claude:
    binary: "claude"
    argv: ["-p", "{prompt}", "--model", "{model}"]
    prompt_delivery: argv
    interactive:
      # Interativo por padrao; PROMPT e posicional.
      supported: true
      argv: ["--model", "{model}", "{prompt}"]
    autonomy:
      supported: true
      argv: ["--dangerously-skip-permissions"]
    default_model: "claude-sonnet-5"
    provides:
      providers: [anthropic]
      models: []
    effort:
      # `--effort low|medium|high|xhigh|max`
      supported: true
      argv: ["--effort", "{effort}"]
      mapping: { low: low, high: high, max: max }
  opencode:
    binary: "opencode"
    # O subcomando `run` e o modo nao interativo; sem ele a TUI abre e trava.
    argv: ["run", "--model", "{model}", "{prompt}"]
    prompt_delivery: argv
    interactive:
      # A TUI abre sem aceitar prompt inicial, entao nao da para conduzir por
      # send a partir da abertura. Use o modo `run`.
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: ["--auto"]
    default_model: "deepseek-v4-flash"
    provides:
      providers: []
      models: []
    effort:
      # `--variant` recebe a variante de raciocinio do provedor. O help cita
      # high, max e minimal; `low` fica fora do mapping porque nao ha
      # equivalente nomeado e adivinhar seria creditar esforco que nao existe.
      supported: true
      argv: ["--variant", "{effort}"]
      mapping: { high: high, max: max }
  agy:
    binary: "agy"
    # `--print` e obrigatorio: sem ele a sessao abre interativa e nao retorna.
    argv: ["--model", "{model}", "--print", "{prompt}"]
    prompt_delivery: argv
    interactive:
      # `-i` executa o prompt inicial e mantem a sessao aberta.
      supported: true
      argv: ["--model", "{model}", "-i", "{prompt}"]
    autonomy:
      supported: true
      argv: ["--dangerously-skip-permissions"]
    # Os ids desta CLI embutem o esforco no proprio nome do modelo
    # (ex.: `<familia>-high` / `-medium` / `-low`). Consulte `agy models`.
    default_model: "gemini-3.7-flash-high"
    provides:
      providers: [google]
      models: []
    effort:
      # `--effort low|medium|high`. Nao existe `max`, entao `max` fica fora do
      # mapping de proposito: creditar um esforco inexistente seria mentira.
      supported: true
      argv: ["--effort", "{effort}"]
      mapping: { low: low, high: high }
  qwen:
    binary: "qwen"
    argv: ["--model", "{model}", "--prompt", "{prompt}"]
    prompt_delivery: argv
    interactive:
      # `-i, --prompt-interactive`
      supported: true
      argv: ["--model", "{model}", "-i", "{prompt}"]
    autonomy:
      # Esta versao nao expoe nenhuma flag de aprovacao automatica. Declarar
      # uma inexistente faria a delegacao falhar na abertura.
      supported: false
      argv: []
    default_model: "qwen3.7-plus"
    provides:
      providers: [alibaba]
      models: []
    effort:
      supported: false
      argv: []
      mapping: {}
  kimi:
    binary: "kimi"
    argv: ["--model", "{model}", "--prompt", "{prompt}"]
    prompt_delivery: argv
    interactive:
      # Nao aceita prompt posicional; so `-c/--continue` retoma sessao.
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: ["--yolo"]
    default_model: "kimi-k2-chat"
    provides:
      providers: []
      models: []
    effort:
      supported: false
      argv: []
      mapping: {}

# Adaptadores de terminal visível (Linux-first). `preference` é a ordem tentada
# quando o Orchestrator pede `--terminal auto`. `tmux` só é elegível dentro de
# uma sessão tmux. Se nada abrir, o l-nexus NÃO executa em background escondido:
# ele bloqueia com o motivo ou roda inline no terminal atual (fallback).
#
# Para um emulador fora da lista, use `custom` com `argv` e os placeholders
# {title} {cwd} {command} — o l-nexus repassa isso a `lnx-run.sh --terminal-cmd`.
terminal_runners:
  preference: [tmux, gnome-terminal, konsole, xfce4-terminal, kitty, alacritty, wezterm, tilix, terminator, x-terminal-emulator, xterm]
  fallback: inline
  hold: auto
  hold_seconds: 30
  adapters:
    custom:
      binary: ""
      argv: []
