cli_runners:
  # Interfaces verificadas contra os binarios instalados em 2026-08-31 com
  # `--help`. Ao trocar de CLI ou de versao, confirme antes de editar: um
  # template errado trava a delegacao (modo interativo que nao retorna) ou
  # credita um effort que a CLI nao aplica.
  #
  # argv         modo nao interativo, uma tacada so (gate automatico)
  # interactive  sessao que continua aberta, para o Orchestrator conduzir
  # autonomy     auto-aprovacao de ferramentas. NUNCA entra no argv padrao:
  #              e opt-in por invocacao, porque desliga a confirmacao da
  #              propria CLI e contraria a regra do l-nexus de que comando
  #              destrutivo exige confirmacao humana. Evite em R3.
  codex:
    binary: "codex"
    # `codex exec ... -` le as instrucoes do stdin.
    argv: [ "exec", "--model", "{model}", "-" ]
    prompt_delivery: stdin
    interactive:
      # Sem subcomando as opcoes vao para a CLI interativa; PROMPT e posicional.
      supported: true
      argv: [ "--model", "{model}", "{prompt}" ]
    autonomy:
      supported: true
      argv: [ "--dangerously-bypass-approvals-and-sandbox" ]
    default_model: "gpt-5.6-sol"
    provides:
      providers: [ openai ]
      models: []
    effort:
      # Nao verificado nesta versao da CLI. Deixe false ate confirmar.
      supported: false
      argv: []
      mapping: {}
  claude:
    binary: "claude"
    argv: [ "-p", "{prompt}", "--model", "{model}" ]
    prompt_delivery: argv
    interactive:
      # Interativo por padrao; PROMPT e posicional.
      supported: true
      argv: [ "--model", "{model}", "{prompt}" ]
    autonomy:
      supported: true
      argv: [ "--dangerously-skip-permissions" ]
    default_model: "claude-sonnet-5"
    provides:
      providers: [ anthropic ]
      models: []
    effort:
      # `--effort low|medium|high|xhigh|max`
      supported: true
      argv: [ "--effort", "{effort}" ]
      mapping: { low: low, high: high, max: max }
  opencode:
    binary: "opencode"
    # O subcomando `run` e o modo nao interativo; sem ele a TUI abre e trava.
    argv: [ "run", "--model", "{model}", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      # A TUI abre sem aceitar prompt inicial, entao nao da para conduzir por
      # send a partir da abertura. Use o modo `run`.
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: [ "--auto" ]
    default_model: "deepseek-v4-flash"
    provides:
      # meituan e xiaomi nao tem CLI propria nem entrada por familia: opencode e
      # o unico caminho ate eles, e nenhum outro runner os declara. Sem isto o
      # modelo existe no catalogo e nao tem por onde rodar -- o Planner o coloca
      # no slot e o Orchestrator bloqueia na largada. Cabem aqui, e nao numa
      # entrada por familia, porque os dois declaram `effort_levels: []`: nao ha
      # vocabulario de esforco para traduzir.
      providers: [ meituan, xiaomi ]
      models: []
    effort:
      # DESLIGADO de proposito nesta entrada generica. O `--variant` repassa o
      # nivel ao provedor, mas o vocabulario e DO MODELO, nao da CLI: DeepSeek so
      # aceita high/max, Qwen nao tem max, GLM e MiniMax so tem `thinking`, e ha
      # modelos sem controle nenhum. Um mapping unico aqui mentiria para a
      # maioria -- mandar `max` a um Qwen devolve 400. Quem precisa de esforco
      # usa uma das entradas por familia abaixo, onde o mapping pode ser honesto.
      supported: false
      argv: [ "--variant", "{effort}" ]
      mapping: {}

  # As tres entradas a seguir sao o MESMO binario. O que muda e a capacidade, e
  # e por isso que sao runners separados: cada familia de modelo fala um
  # vocabulario de esforco diferente, e `effort.mapping` e o lugar desenhado
  # para traduzir do vocabulario do kit para o do provedor.
  opencode-deepseek:
    binary: "opencode"
    argv: [ "run", "--model", "{model}", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: [ "--auto" ]
    provides:
      providers: [ deepseek ]
      models: []
    effort:
      # DeepSeek nao tem `low`: pedir devolve 400, entao fica fora do mapping.
      supported: true
      argv: [ "--variant", "{effort}" ]
      mapping: { high: high, max: max }

  opencode-qwen:
    binary: "opencode"
    argv: [ "run", "--model", "{model}", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: [ "--auto" ]
    provides:
      providers: [ alibaba, tencent ]
      models: []
    effort:
      # Qwen e Hy3 vao ate `high`. `max` nao existe neles, entao nao se declara:
      # declarar abriria a porta para creditar um esforco que devolveria 400.
      supported: true
      argv: [ "--variant", "{effort}" ]
      mapping: { low: low, high: high }

  opencode-muse:
    binary: "opencode"
    argv: [ "run", "--model", "{model}", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: [ "--auto" ]
    provides:
      providers: [ meta, xai, openai ]
      models: []
    effort:
      # Esta familia vai de `minimal` a `xhigh` e NAO tem `max`. O `max` do kit
      # significa "o maximo que este modelo da", e nesta familia isso se chama
      # `xhigh` -- traduzir aqui e exatamente para o que o mapping existe, e
      # evita inventar um nivel novo no vocabulario do kit.
      supported: true
      argv: [ "--variant", "{effort}" ]
      mapping: { low: low, high: high, max: xhigh }
  agy:
    binary: "agy"
    # `--print` e obrigatorio: sem ele a sessao abre interativa e nao retorna.
    argv: [ "--model", "{model}", "--print", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      # `-i` executa o prompt inicial e mantem a sessao aberta.
      supported: true
      argv: [ "--model", "{model}", "-i", "{prompt}" ]
    autonomy:
      supported: true
      argv: [ "--dangerously-skip-permissions" ]
    # Os ids desta CLI embutem o esforco no proprio nome do modelo
    # (ex.: `<familia>-high` / `-medium` / `-low`). Consulte `agy models`.
    default_model: "gemini-3.7-flash-high"
    provides:
      providers: [ google ]
      models: []
    effort:
      # `--effort low|medium|high`. Nao existe `max`, entao `max` fica fora do
      # mapping de proposito: creditar um esforco inexistente seria mentira.
      supported: true
      argv: [ "--effort", "{effort}" ]
      mapping: { low: low, high: high }
  qwen:
    binary: "qwen"
    argv: [ "--model", "{model}", "--prompt", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      # `-i, --prompt-interactive`
      supported: true
      argv: [ "--model", "{model}", "-i", "{prompt}" ]
    autonomy:
      # Esta versao nao expoe nenhuma flag de aprovacao automatica. Declarar
      # uma inexistente faria a delegacao falhar na abertura.
      supported: false
      argv: []
    default_model: "qwen3.7-plus"
    provides:
      providers: [ alibaba ]
      models: []
    effort:
      supported: false
      argv: []
      mapping: {}
  kimi:
    binary: "kimi"
    argv: [ "--model", "{model}", "--prompt", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      # Nao aceita prompt posicional; so `-c/--continue` retoma sessao.
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: [ "--yolo" ]
    default_model: "kimi-k2-chat"
    provides:
      providers: []
      models: []
    effort:
      supported: false
      argv: []
      mapping: {}

# Adaptadores de terminal visível (Linux-first). `preference` é a ordem tentada
# quando o Orchestrator pede `--terminal auto`. `tmux` só é elegível dentro de
# uma sessão tmux. Se nada abrir, o l-nexus NÃO executa em background escondido:
# ele bloqueia com o motivo ou roda inline no terminal atual (fallback).
#
# Para um emulador fora da lista, use `custom` com `argv` e os placeholders
# {title} {cwd} {command} — o l-nexus repassa isso a `lnx-run.sh --terminal-cmd`.
terminal_runners:
  preference: [ tmux, gnome-terminal, konsole, xfce4-terminal, kitty, alacritty, wezterm, tilix, terminator, x-terminal-emulator, xterm ]
  fallback: inline
  hold: auto
  hold_seconds: 30
  adapters:
    custom:
      binary: ""
      argv: []
