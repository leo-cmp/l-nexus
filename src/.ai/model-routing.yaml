risk_domains:
  generic_r3:
    - authentication-authorization
    - secrets-cryptography
    - payments-money
    - destructive-data-migrations
    - personal-data-lifecycle
    - tenant-account-isolation
    - backup-restore-deployment
    - material-concurrency-idempotency
  project: []

# Piso obrigatório por risco. `work_routes` escolhe modelos DENTRO deste piso e
# nunca pode enfraquecê-lo: o validador confere os slots contra estas rotas.
routes:
  R1:
    executor_profile: economical
    review: optional
    test_gate: optional
    independent_model: false
  R2:
    executor_profile: balanced
    review: project_policy
    test_gate: project_policy
    tester_profile: balanced
    reviewer_profile: balanced
    independent_model: true
  R3:
    executor_profile: frontier
    review: required
    test_gate: required
    tester_profile: balanced
    reviewer_profile: frontier
    independent_model: true
    cross_provider: project_policy

# Orçamento de tentativas. Torna o loop infinito impossível por contrato.
execution_policy:
  max_same_executor_reworks: 1
  max_upgrades: 1
  max_total_execution_attempts: 3

# Recomendações de roteamento por tipo de trabalho. É a entrada declarativa do
# Planner: ele escolhe aqui os slots concretos e os PERSISTE na task, que passa a
# ser o contrato. Estas entradas são recomendações do projeto, nunca decisões
# fixas de código — troque livremente os modelos abaixo.
#
# Slots:
#   default                     preferência normal
#   alt1 / alt2                 alternativas LATERAIS (indisponibilidade, custo,
#                               rate limit, provedor, especialização, preferência
#                               humana) — não são uma escada de retry
#   upgrade_alt1 / upgrade_alt2 escalada VERTICAL, só depois de esgotar rework ou
#                               quando a tarefa se revelou materialmente maior
# Effort permitido: default | low | high | max
# Recomendacoes de roteamento por tipo de trabalho. E a entrada declarativa do
# Planner: ele escolhe aqui os slots concretos e os PERSISTE na task, que passa a
# ser o contrato.
#
# Tres regras moldam as rotas abaixo, e todas vieram de defeito observado:
#
# 1. PAPEIS DISJUNTOS. Um modelo nao se repete entre executor, tester e
#    reviewer, nem como alternativa. Se o mesmo modelo pode cair em dois papeis,
#    mais cedo ou mais tarde ele testa e revisa o proprio trabalho, e o gate
#    vira carimbo. Aconteceu.
#
# 2. NENHUM PAPEL DE GATE COM UMA FONTE SO. Quando a cota de um provedor esgota
#    e nao sobra alternativa legitima, o agente nao para: ele fabrica uma. Ja
#    houve caso de Orchestrator EDITAR o proprio contrato para legalizar a
#    escolha. A saida nao e instruir mais, e nunca criar o beco.
#
# 3. O CARO FICA NO FIM. Modelos de cota curta entram como ultima alternativa
#    lateral, nunca como default. Modelos que cobram direto da conta do humano
#    ficam nos slots de upgrade e dependem de `runner_policy`.
#
# 4. ENTRADA QUE E CONJUNTO NAO REPETE MEMBRO. Quando uma entrada do catalogo
#    resolve para um POOL de modelos, e nao para um so, dois pools de papeis
#    diferentes nao podem compartilhar membro. De fora sao dois nomes distintos
#    e a regra 1 aprova; no dia em que a cota apertar, os dois caem no mesmo
#    modelo e o executor revisa a si mesmo. O validador nao ve isso -- ele
#    confere nomes, nao composicao. Quem garante e quem escreve este arquivo.
#
# Slots:
#   default                     preferencia normal
#   alt1 / alt2                 alternativas LATERAIS, em ordem de preferencia;
#                               a ultima e tipicamente a de cota mais curta
#   upgrade_alt1 / upgrade_alt2 escalada VERTICAL, so depois de esgotar rework
work_routes:
  backend-implementation:
    executor:
      default: { model: 9r-executor-frontier }
      alt1: { model: meituan-longcat-2-0 }
      alt2: { model: anthropic-sonnet-4-6, effort: default }
      upgrade_alt1: { model: deepseek-v4-1-flash, effort: max }
      upgrade_alt2: { model: openai-gpt-5-6-sol, effort: max }
    tester:
      default: { model: 9r-tester }
      alt1: { model: alibaba-qwen-3-6-plus, effort: high }
      alt2: { model: anthropic-haiku-4-5, effort: high }
    reviewer:
      default: { model: 9r-reviewer }
      alt1: { model: openai-gpt-5-6-luna, effort: high }
      alt2: { model: anthropic-opus-4-6, effort: default }
      upgrade_alt1: { model: anthropic-opus-5, effort: max }

  frontend-implementation:
    executor:
      default: { model: 9r-executor }
      alt1: { model: deepseek-v4-1-flash, effort: high }
      alt2: { model: anthropic-sonnet-4-6, effort: default }
      upgrade_alt1: { model: deepseek-v4-1-flash, effort: max }
      upgrade_alt2: { model: openai-gpt-5-6-sol, effort: max }
    tester:
      default: { model: 9r-tester }
      alt1: { model: alibaba-qwen-3-6-plus, effort: high }
      alt2: { model: anthropic-haiku-4-5, effort: high }
    reviewer:
      default: { model: 9r-reviewer }
      alt1: { model: openai-gpt-5-6-luna, effort: high }
      alt2: { model: anthropic-opus-4-6, effort: default }

