schema_version: 2

# 🔒 [PROJETO] Roteamento de Modelos, Executores de CLI e Terminais
# Este arquivo pertence exclusivamente ao projeto local e NUNCA é sobrescrito pelo `npx update`.
#
# Camadas deliberadamente desacopladas:
#   ROLE (planner/orchestrator/executor/tester/reviewer)
#     -> MODEL ROUTING (default/alt1/alt2/upgrade_alt1/upgrade_alt2 + effort)
#       -> CLI RUNNER (como aquele modelo é executado)
#         -> TERMINAL RUNNER (como a execução fica visível)
# Nenhum modelo, provedor, CLI ou terminal é decisão fixa de código: tudo o que
# está abaixo é configuração do projeto e pode ser trocado sem alterar o l-nexus.
project_policy:
  r2_review: optional
  r2_test_gate: optional
  r3_cross_provider: true
  unknown_model_identity: reject_for_r3

# Runners que consomem credito PAGO DIRETO da conta do humano, fora das
# assinaturas de opencode e agy. Ficam desligados por padrao: um roteamento que
# escolhe sozinho o caminho caro transforma decisao de orcamento em acidente.
#
# Ligar e decisao humana e consciente. Com `enabled: false`, o Planner nao deve
# colocar nos slots nenhum modelo cujo unico runner esteja desligado, e o
# Orchestrator nao deve ativa-lo nem como ultimo recurso — bloqueia e avisa.
runner_policy:
  claude:
    enabled: false
    conta: "API Anthropic do humano, cobrada por token"
  codex:
    enabled: false
    conta: "API OpenAI do humano, cobrada por token"
  qwen:
    enabled: false
    conta: "Assinatura Qwen Code, nao contratada; os modelos alibaba sao alcancados por opencode-qwen"

profiles:
  economical:
    rank: 1
    description: Trabalho localizado, reversivel e de baixo risco.
  balanced:
    rank: 2
    description: Implementacao delimitada, integracoes e testes usuais.
  frontier:
    rank: 3
    description: Arquitetura, investigacao dificil e trabalho de alto risco.

# Catálogo oficial de modelos avaliados no projeto:
# effort_levels: quais niveis de raciocinio o modelo aceita NO GATEWAY em que ele
# e alcancado -- levantado do painel, nao inferido. Existe porque os provedores
# usam vocabularios incompativeis: DeepSeek so tem high/max, Qwen tem
# low/medium/high, GLM e MiniMax so tem `thinking`, e ha modelos sem controle
# nenhum. Pedir um nivel que o modelo nao aceita devolve HTTP 400, entao isto
# faz parte da elegibilidade, nao e informacao decorativa. Lista vazia significa
# que o modelo nao expoe controle de raciocinio.
models:
  anthropic-opus-5:
    provider: anthropic
    model: "claude-opus-5"
    profile: frontier
    profile_by_variant:
      default: frontier
      low: balanced
      high: frontier
      max: frontier
    status: active
    capabilities: [ backend, frontend, tests, sql, review, vision, long-context ]
    last_evaluated: 2026-08-27
    evidence: "A documentação atual da Anthropic identifica `claude-opus-5` para trabalho agentic de programação complexo; no lançamento, a Lovable reportou +22% de sucesso nas suas tarefas agentic de código mais difíceis versus Opus 4.7, sustentando `frontier` no esforço padrão. [S1][S2]"

  openai-gpt-5-6-sol:
    provider: openai
    model: "gpt-5.6-sol"
    profile: frontier
    profile_by_variant:
      default: frontier
      low: balanced
      high: frontier
      max: frontier
    status: active
    capabilities: [ backend, frontend, tests, sql, review, vision, long-context ]
    last_evaluated: 2026-08-27
    evidence: "A OpenAI documenta `gpt-5.6-sol` como o modelo frontier da família; no lançamento, Sol em Max marcou 80 no Artificial Analysis Coding Agent Index e 72,7% no DeepSWE v1.1, justificando `frontier`, com Low rebaixado por reduzir compute de raciocínio. [S5][S6]"

