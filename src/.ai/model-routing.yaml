schema_version: 2

# 🔒 [PROJETO] Roteamento de Modelos, Executores de CLI e Terminais
# Este arquivo pertence exclusivamente ao projeto local e NUNCA é sobrescrito pelo `npx update`.
#
# Camadas deliberadamente desacopladas:
#   ROLE (planner/orchestrator/executor/tester/reviewer)
#     -> MODEL ROUTING (default/alt1/alt2/upgrade_alt1/upgrade_alt2 + effort)
#       -> CLI RUNNER (como aquele modelo é executado)
#         -> TERMINAL RUNNER (como a execução fica visível)
# Nenhum modelo, provedor, CLI ou terminal é decisão fixa de código: tudo o que
# está abaixo é configuração do projeto e pode ser trocado sem alterar o l-nexus.
project_policy:
  r2_review: optional
  r2_test_gate: optional
  r3_cross_provider: true
  unknown_model_identity: reject_for_r3

# Runners que consomem credito PAGO DIRETO da conta do humano, fora das
# assinaturas de opencode e agy. Ficam desligados por padrao: um roteamento que
# escolhe sozinho o caminho caro transforma decisao de orcamento em acidente.
#
# Ligar e decisao humana e consciente. Com `enabled: false`, o Planner nao deve
# colocar nos slots nenhum modelo cujo unico runner esteja desligado, e o
# Orchestrator nao deve ativa-lo nem como ultimo recurso — bloqueia e avisa.
runner_policy:
  claude:
    enabled: false
    conta: "API Anthropic do humano, cobrada por token"
  codex:
    enabled: false
    conta: "API OpenAI do humano, cobrada por token"

profiles:
  economical:
    rank: 1
    description: Trabalho localizado, reversivel e de baixo risco.
  balanced:
    rank: 2
    description: Implementacao delimitada, integracoes e testes usuais.
  frontier:
    rank: 3
    description: Arquitetura, investigacao dificil e trabalho de alto risco.

# Catálogo oficial de modelos avaliados no projeto:
models:
