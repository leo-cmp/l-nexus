schema_version: 3

# Schema 3: o roteamento passou a ser por combo do 9router. O kit nao escolhe
# mais modelo -- o gateway escolhe, faz fallback de quota e devolve no campo
# `model` da resposta quem de fato atendeu. O catalogo de 43 modelos com perfil,
# capacidade e evidencia saiu daqui e virou referencia em
# docs/avaliacoes/2026-09-21-catalogo-de-modelos.md.
#
# O que sobrou nao sabe o que e um modelo. As regras perguntam se a revisao
# existe, se aponta para o commit certo e se quem revisou nao foi quem executou
# -- comparando strings, nao perfis. Por isso modelo novo no gateway nunca
# reprova uma task: nao ha o que conferir sobre ele.

# Portoes por nivel de risco. `from_policy` delega a decisao ao projeto.
project_policy:
  r2_review: optional
  r2_test_gate: optional

routes:
  R1:
    review: optional
    test_gate: optional
    independent_model: false
  R2:
    review: project_policy
    test_gate: project_policy
    independent_model: true
  R3:
    review: required
    test_gate: required
    independent_model: true

# Qual CLI fala com o gateway. Antes o runner saia do provedor do modelo; com
# combo nao ha provedor, entao e escolha direta. `claude` e o padrao porque e o
# unico runner medido que de fato entrega o esforco pedido -- o log do gateway
# registra o nivel nas requisicoes dele, e as do opencode chegam sempre no mesmo
# nivel, independente do que foi pedido. Um combo pode sobrescrever com `runner`.
default_runner: claude

# Os combos do 9router e o esforco de cada um, no vocabulario cru do provedor:
# o que esta escrito aqui e o que sai na requisicao, sem traducao. O nivel nao
# volta na resposta, entao ele e declaracao -- o que volta e quem atendeu e,
# na maioria dos provedores, quantos tokens de raciocinio foram gastos.
#
# Quem monta os combos garante que eles nao compartilham modelo entre papeis.
# O kit nao tem como ver dentro do combo; o que ele confere e o modelo REAL que
# a resposta devolveu, depois do fato.
combos:
  9r-executor: { effort: default }
  9r-executor-frontier: { effort: max }
  9r-tester: { effort: default }
  9r-tester-frontier: { effort: high }
  9r-reviewer: { effort: high }
  9r-reviewer-frontier: { effort: xhigh }

# Qual combo cada papel usa. `critical` vale para R3.
roles:
  executor:
    default: 9r-executor
    critical: 9r-executor-frontier
  tester:
    default: 9r-tester
    critical: 9r-tester-frontier
  reviewer:
    default: 9r-reviewer
    critical: 9r-reviewer-frontier

# Orçamento de tentativas. Torna o loop infinito impossível por contrato.
execution_policy:
  max_same_executor_reworks: 1
  max_upgrades: 1
  max_total_execution_attempts: 3

# As tres regras que moldaram este arquivo, todas vindas de defeito observado:
#
# 1. PAPEIS DISJUNTOS. Um modelo nao serve dois papeis. Se o mesmo modelo pode
#    cair em executor e revisor, mais cedo ou mais tarde ele revisa o proprio
#    trabalho e o portao vira carimbo. Aconteceu. Com combo isso e INVISIVEL
#    daqui: dois combos distintos podem resolver para o mesmo modelo. Quem
#    garante a disjuncao e quem monta os combos; o kit so consegue conferir
#    depois, comparando os modelos que de fato responderam.
#
# 2. NENHUM PAPEL DE GATE COM UMA FONTE SO. Quando a cota esgota e nao sobra
#    alternativa legitima, o agente nao para: ele fabrica uma. Ja houve caso de
#    Orchestrator EDITAR o proprio contrato para legalizar a escolha. Hoje quem
#    resolve isso e o fallback do gateway, uma camada abaixo -- e por isso os
#    slots alternativos deixaram de existir aqui.
#
# 3. O CARO FICA DESLIGADO POR PADRAO. Runner que cobra direto da conta do
#    humano so entra por decisao consciente, via `runner_policy`.

risk_domains:
  generic_r3:
    - authentication-authorization
    - secrets-cryptography
    - payments-money
    - destructive-data-migrations
    - personal-data-lifecycle
    - tenant-account-isolation
    - backup-restore-deployment
    - material-concurrency-idempotency
  project: []

# Runners que consomem credito PAGO DIRETO da conta do humano, fora das
# assinaturas de opencode e agy. Ficam desligados por padrao: um roteamento que
# escolhe sozinho o caminho caro transforma decisao de orcamento em acidente.
#
# Ligar e decisao humana e consciente. Com `enabled: false`, o Planner nao deve
# colocar nos slots nenhum modelo cujo unico runner esteja desligado, e o
# Orchestrator nao deve ativa-lo nem como ultimo recurso — bloqueia e avisa.
runner_policy:
  claude:
    # Ligado: a assinatura esta ativa. E o unico runner medido que de fato
    # entrega o esforco pedido -- o log do gateway registra THINK:high nas
    # requisicoes dele, enquanto as do opencode chegam sempre como THINK:low.
    # Apontado para um gateway local por settings.local.json ele nem consome a
    # API da Anthropic: gasta a cota do gateway. Reveja se a assinatura nao for
    # renovada, que e o unico motivo para desligar de novo.
    enabled: true
    conta: "Assinatura Claude ativa; por gateway local nao toca a API paga"
  codex:
    enabled: false
    conta: "API OpenAI do humano, cobrada por token"
  qwen:
    enabled: false
    conta: "Assinatura Qwen Code, nao contratada; os modelos alibaba sao alcancados por opencode-qwen"

cli_runners:
  # Interfaces verificadas contra os binarios instalados em 2026-08-31 com
  # `--help`. Ao trocar de CLI ou de versao, confirme antes de editar: um
  # template errado trava a delegacao (modo interativo que nao retorna) ou
  # credita um effort que a CLI nao aplica.
  #
  # argv         modo nao interativo, uma tacada so (gate automatico)
  # interactive  sessao que continua aberta, para o Orchestrator conduzir
  # autonomy     auto-aprovacao de ferramentas. NUNCA entra no argv padrao:
  #              e opt-in por invocacao, porque desliga a confirmacao da
  #              propria CLI e contraria a regra do l-nexus de que comando
  #              destrutivo exige confirmacao humana. Evite em R3.
  codex:
    binary: "codex"
    # `codex exec ... -` le as instrucoes do stdin.
    argv: [ "exec", "--model", "{model}", "-" ]
    prompt_delivery: stdin
    interactive:
      # Sem subcomando as opcoes vao para a CLI interativa; PROMPT e posicional.
      supported: true
      argv: [ "--model", "{model}", "{prompt}" ]
    autonomy:
      supported: true
      argv: [ "--dangerously-bypass-approvals-and-sandbox" ]
    default_model: "gpt-5.6-sol"
    effort:
      # Nao verificado nesta versao da CLI. Deixe false ate confirmar.
      supported: false
      argv: []
  claude:
    binary: "claude"
    argv: [ "-p", "{prompt}", "--model", "{model}" ]
    prompt_delivery: argv
    interactive:
      # Interativo por padrao; PROMPT e posicional.
      supported: true
      argv: [ "--model", "{model}", "{prompt}" ]
    autonomy:
      supported: true
      argv: [ "--dangerously-skip-permissions" ]
    default_model: "claude-sonnet-5"
    effort:
      # `--effort low|medium|high|xhigh|max`
      supported: true
      argv: [ "--effort", "{effort}" ]
  opencode:
    binary: "opencode"
    # O subcomando `run` e o modo nao interativo; sem ele a TUI abre e trava.
    argv: [ "run", "--model", "{model}", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      # A TUI abre sem aceitar prompt inicial, entao nao da para conduzir por
      # send a partir da abertura. Use o modo `run`.
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: [ "--auto" ]
    default_model: "deepseek-v4-flash"
    effort:
      # DESLIGADO de proposito nesta entrada generica. O `--variant` repassa o
      # nivel ao provedor, mas o vocabulario e DO MODELO, nao da CLI: DeepSeek so
      # aceita high/max, Qwen nao tem max, GLM e MiniMax so tem `thinking`, e ha
      # modelos sem controle nenhum. Um mapping unico aqui mentiria para a
      # maioria -- mandar `max` a um Qwen devolve 400. Quem precisa de esforco
      # usa uma das entradas por familia abaixo, onde o mapping pode ser honesto.
      supported: false
      argv: [ "--variant", "{effort}" ]
  agy:
    binary: "agy"
    # `--print` e obrigatorio: sem ele a sessao abre interativa e nao retorna.
    argv: [ "--model", "{model}", "--print", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      # `-i` executa o prompt inicial e mantem a sessao aberta.
      supported: true
      argv: [ "--model", "{model}", "-i", "{prompt}" ]
    autonomy:
      supported: true
      argv: [ "--dangerously-skip-permissions" ]
    # Os ids desta CLI embutem o esforco no proprio nome do modelo
    # (ex.: `<familia>-high` / `-medium` / `-low`). Consulte `agy models`.
    default_model: "gemini-3.7-flash-high"
    effort:
      # `--effort low|medium|high`. Nao existe `max`, entao `max` fica fora do
      # mapping de proposito: creditar um esforco inexistente seria mentira.
      supported: true
      argv: [ "--effort", "{effort}" ]
  qwen:
    binary: "qwen"
    argv: [ "--model", "{model}", "--prompt", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      # `-i, --prompt-interactive`
      supported: true
      argv: [ "--model", "{model}", "-i", "{prompt}" ]
    autonomy:
      # Esta versao nao expoe nenhuma flag de aprovacao automatica. Declarar
      # uma inexistente faria a delegacao falhar na abertura.
      supported: false
      argv: []
    default_model: "qwen3.7-plus"
    effort:
      supported: false
      argv: []
  kimi:
    binary: "kimi"
    argv: [ "--model", "{model}", "--prompt", "{prompt}" ]
    prompt_delivery: argv
    interactive:
      # Nao aceita prompt posicional; so `-c/--continue` retoma sessao.
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: [ "--yolo" ]
    default_model: "kimi-k2-chat"
    effort:
      supported: false
      argv: []

# Adaptadores de terminal visível (Linux-first). `preference` é a ordem tentada
# quando o Orchestrator pede `--terminal auto`. `tmux` só é elegível dentro de
# uma sessão tmux. Se nada abrir, o l-nexus NÃO executa em background escondido:
# ele bloqueia com o motivo ou roda inline no terminal atual (fallback).
#
# Para um emulador fora da lista, use `custom` com `argv` e os placeholders
# {title} {cwd} {command} — o l-nexus repassa isso a `lnx-run.sh --terminal-cmd`.

# Adaptadores de terminal visível (Linux-first). `preference` é a ordem tentada
# quando o Orchestrator pede `--terminal auto`. `tmux` só é elegível dentro de
# uma sessão tmux. Se nada abrir, o l-nexus NÃO executa em background escondido:
# ele bloqueia com o motivo ou roda inline no terminal atual (fallback).
#
# Para um emulador fora da lista, use `custom` com `argv` e os placeholders
# {title} {cwd} {command} — o l-nexus repassa isso a `lnx-run.sh --terminal-cmd`.
terminal_runners:
  preference: [ tmux, gnome-terminal, konsole, xfce4-terminal, kitty, alacritty, wezterm, tilix, terminator, x-terminal-emulator, xterm ]
  fallback: inline
  hold: auto
  hold_seconds: 30
  adapters:
    custom:
      binary: ""
      argv: []
