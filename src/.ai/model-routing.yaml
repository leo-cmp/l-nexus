schema_version: 2

# 🔒 [PROJETO] Roteamento de Modelos, Executores de CLI e Terminais
# Este arquivo pertence exclusivamente ao projeto local e NUNCA é sobrescrito pelo `npx update`.
#
# Camadas deliberadamente desacopladas:
#   ROLE (planner/orchestrator/executor/tester/reviewer)
#     -> MODEL ROUTING (default/alt1/alt2/upgrade_alt1/upgrade_alt2 + effort)
#       -> CLI RUNNER (como aquele modelo é executado)
#         -> TERMINAL RUNNER (como a execução fica visível)
# Nenhum modelo, provedor, CLI ou terminal é decisão fixa de código: tudo o que
# está abaixo é configuração do projeto e pode ser trocado sem alterar o l-nexus.
project_policy:
  r2_review: optional
  r2_test_gate: optional
  r3_cross_provider: true
  unknown_model_identity: reject_for_r3

profiles:
  economical:
    rank: 1
    description: Trabalho localizado, reversivel e de baixo risco.
  balanced:
    rank: 2
    description: Implementacao delimitada, integracoes e testes usuais.
  frontier:
    rank: 3
    description: Arquitetura, investigacao dificil e trabalho de alto risco.

# Catálogo oficial de modelos avaliados no projeto:
models:
  anthropic-opus-5:
    provider: anthropic
    model: "claude-opus-5"
    profile: frontier
    profile_by_variant:
      default: frontier
      low: balanced
      high: frontier
      max: frontier
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A documentação atual da Anthropic identifica `claude-opus-5` para trabalho agentic de programação complexo; no lançamento, a Lovable reportou +22% de sucesso nas suas tarefas agentic de código mais difíceis versus Opus 4.7, sustentando `frontier` no esforço padrão. [S1][S2]"

  openai-gpt-5-6-sol:
    provider: openai
    model: "gpt-5.6-sol"
    profile: frontier
    profile_by_variant:
      default: frontier
      low: balanced
      high: frontier
      max: frontier
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A OpenAI documenta `gpt-5.6-sol` como o modelo frontier da família; no lançamento, Sol em Max marcou 80 no Artificial Analysis Coding Agent Index e 72,7% no DeepSWE v1.1, justificando `frontier`, com Low rebaixado por reduzir compute de raciocínio. [S5][S6]"

  anthropic-sonnet-5:
    provider: anthropic
    model: "claude-sonnet-5"
    profile: frontier
    profile_by_variant:
      default: frontier
      low: balanced
      high: frontier
      max: frontier
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A Anthropic lista `claude-sonnet-5` entre os modelos atuais e o lançamento de 30/06/2026 documenta desempenho de agentic coding em classe Opus, além de ganhos em tarefas de engenharia de software, o que sustenta `frontier` no padrão e acima, mas não em Low. [S1][S3]"

  openai-gpt-5-6-terra:
    provider: openai
    model: "gpt-5.6-terra"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: balanced
      high: frontier
      max: frontier
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A OpenAI define `gpt-5.6-terra` como a opção que equilibra inteligência e custo; sua tabela de coding reporta 77,4 no Artificial Analysis Coding Agent Index, 63,4% no SWE-Bench Pro, 69,6% no DeepSWE v1.1 e 87,4% no Terminal-Bench 2.1, sustentando `balanced` por padrão e `frontier` apenas com High/Max. [S5][S7]"

  deepseek-v4-pro:
    provider: deepseek
    model: "deepseek-v4-pro"
    profile: frontier
    profile_by_variant:
      default: frontier
      low: balanced
      high: frontier
      max: frontier
    status: active
    capabilities: [backend, frontend, tests, sql, review, long-context]
    last_evaluated: 2026-08-27
    evidence: "A DeepSeek levou `deepseek-v4-pro` a GA em 13/08/2026 e reportou 87,9 no Terminal-Bench 2.1, 61,5 no NL2Repo, 62,7 no DeepSWE v1.1 e 83,3 no CyberGym, além de posicioná-lo como seu modelo SOTA para agentic coding; por isso o padrão é `frontier`. [S9][S10]"

  deepseek-v4-flash:
    provider: deepseek
    model: "deepseek-v4-flash"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: economical
      high: balanced
      max: balanced
    status: preview
    capabilities: [backend, frontend, tests, sql, review, long-context]
    last_evaluated: 2026-08-27
    evidence: "A DeepSeek mantém o ID `deepseek-v4-flash`; a versão 0731 entrou em API como versão formal em public beta e, em avaliações de Code Agent executadas em Max, marcou 82,7 no Terminal-Bench 2.1 e 54,2 no NL2Repo, portanto fica `balanced` e não é promovida a R3 enquanto não houver GA. [S9][S10]"

  deepseek-v4-flash-vision-exp:
    provider: deepseek
    model: "deepseek-v4-flash-vision-exp"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: economical
      high: balanced
      max: balanced
    status: preview
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A DeepSeek lançou `deepseek-v4-flash-vision-exp` em 21/08/2026 explicitamente como experimental, com capacidade textual equivalente à V4 Flash e ganhos multimodais; apesar de reportar 83,9 no Terminal-Bench 2.1 em sua avaliação Max, o status experimental mantém todas as variantes no máximo em `balanced`. [S9][S10]"

  google-gemini-3-7-flash:
    provider: google
    model: "gemini-3.7-flash"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: economical
      high: balanced
      max: balanced
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A documentação Google de 13/08/2026 marca `gemini-3.7-flash` como Stable, nativamente multimodal, com 1.048.576 tokens de entrada, execução de código e thinking; como não encontrei ali um número público verificável de benchmark de programação específico do 3.7 Flash, a classificação fica conservadoramente em `balanced`. [S11]"

  anthropic-haiku-4-5:
    provider: anthropic
    model: "claude-haiku-4-5-20251001"
    profile: economical
    profile_by_variant:
      default: economical
      low: economical
      high: balanced
      max: balanced
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A Anthropic documenta o ID datado `claude-haiku-4-5-20251001`; no lançamento, afirmou desempenho de coding semelhante ao Sonnet 4 a um terço do custo e mais de 2x a velocidade, enquanto a Augment reportou cerca de 90% do Sonnet 4.5 em sua avaliação agentic de código, sustentando `economical` por padrão e no máximo `balanced`. [S1][S4]"

  openai-gpt-5-6-luna:
    provider: openai
    model: "gpt-5.6-luna"
    profile: economical
    profile_by_variant:
      default: economical
      low: economical
      high: balanced
      max: balanced
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A OpenAI define `gpt-5.6-luna` para workloads de alto volume sensíveis a custo; embora a tabela de coding reporte 74,6 no Artificial Analysis Coding Agent Index, 62,7% no SWE-Bench Pro, 67,2% no DeepSWE v1.1 e 84,7% no Terminal-Bench 2.1, seu posicionamento nano/cost-sensitive recomenda `economical` no padrão e teto `balanced`. [S5][S8]"

  meta-muse-spark-1-2-contributor:
    provider: meta
    model: "muse-spark-1.2-contributor"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: economical
      high: balanced
      max: balanced
    status: preview
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A documentação da Meta confirma `muse-spark-1.2-contributor` na Meta Model API com contexto de 1M; o lançamento de 05/08/2026 descreve 1.2 como coding-focused, treinado para debugging, entendimento de codebase e trabalho de repositório inteiro e mostra Terminal-Bench 2.1/DeepSWE 1.1 apenas em gráficos sem números textuais verificáveis, por isso fica `balanced` e, conservadoramente, `preview` enquanto a Model API não tiver anúncio de GA localizado. [S12]"

  tencent-hy3:
    provider: tencent
    model: "hy3"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: economical
      high: balanced
      max: balanced
    status: active
    capabilities: [backend, frontend, tests, sql, review, long-context]
    last_evaluated: 2026-08-27
    evidence: "A lista oficial da Tencent Cloud dá `hy3` como API Parameter e a Tencent posiciona Hy3 para Coding Agent e desenvolvimento, reportando mais de 90% de sucesso no teste interno WorkBuddy; como não localizei um score público padronizado de SWE-Bench/Terminal-Bench para Hy3, mantenho `balanced`. [S13]"

  xiaomi-mimo-v2-5:
    provider: xiaomi
    model: "mimo-v2.5"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: economical
      high: balanced
      max: balanced
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "A API oficial da Xiaomi aceita exatamente `mimo-v2.5`, com percepção omni-modal e contexto de 1M; no experimento oficial do MiMo Code usando o mesmo modelo, a Xiaomi reportou 62% no SWE-Bench Pro e 73% no Terminal Bench 2, desempenho forte mas insuficiente para promover o modelo-base não-Pro a `frontier`. [S14]"

  meituan-longcat-2-0:
    provider: meituan
    model: "LongCat-2.0"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: balanced
      high: balanced
      max: balanced
    status: active
    capabilities: [backend, frontend, tests, sql, review, long-context]
    last_evaluated: 2026-08-27
    evidence: "A API LongCat usa exatamente `LongCat-2.0`; a avaliação oficial da Meituan reporta 70,8 no Terminal-Bench 2.1, 59,5 no SWE-bench Pro e 77,3 no SWE-bench Multilingual, bons resultados de engenharia mas abaixo dos modelos aqui classificados como `frontier`, portanto o teto permanece `balanced`. [S15]"

  alibaba-qwen-3-7-plus:
    provider: alibaba
    model: "qwen3.7-plus"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: economical
      high: balanced
      max: balanced
    status: active
    capabilities: [backend, frontend, tests, sql, review, vision, long-context]
    last_evaluated: 2026-08-27
    evidence: "O Alibaba Model Studio documenta `qwen3.7-plus` com contexto de 1M, visão e capacidades agent-level para coding/tool use, mas chama Plus de opção cost-effective que equilibra desempenho e custo; não encontrei no material oficial consultado um score de coding específico do 3.7 Plus que justificasse R3, portanto fica `balanced`. [S16]"

  openai-gpt-oss-120b:
    provider: openai
    model: "gpt-oss-120b"
    profile: balanced
    profile_by_variant:
      default: balanced
      low: balanced
      high: balanced
      max: balanced
    status: active
    capabilities: [backend, frontend, tests, sql, review, long-context]
    last_evaluated: 2026-08-27
    evidence: "A página oficial identifica `gpt-oss-120b` como o maior modelo open-weight da OpenAI e a model card mostra que, em reasoning `high`, ele se aproxima do o4-mini em Codeforces e SWE-Bench Verified; como é um modelo de 2025, text-only e oficialmente suporta low/medium/high, trato o '(medium)' do catálogo como esforço e mantenho o modelo em `balanced`, sem presumir que 'Max' seja um nível nativo da OpenAI. [S17]"

risk_domains:
  generic_r3:
    - authentication-authorization
    - secrets-cryptography
    - payments-money
    - destructive-data-migrations
    - personal-data-lifecycle
    - tenant-account-isolation
    - backup-restore-deployment
    - material-concurrency-idempotency
  project: []

# Piso obrigatório por risco. `work_routes` escolhe modelos DENTRO deste piso e
# nunca pode enfraquecê-lo: o validador confere os slots contra estas rotas.
routes:
  R1:
    executor_profile: economical
    review: optional
    test_gate: optional
    independent_model: false
  R2:
    executor_profile: balanced
    review: project_policy
    test_gate: project_policy
    tester_profile: balanced
    reviewer_profile: balanced
    independent_model: true
  R3:
    executor_profile: frontier
    review: required
    test_gate: required
    tester_profile: balanced
    reviewer_profile: frontier
    independent_model: true
    cross_provider: project_policy

# Orçamento de tentativas. Torna o loop infinito impossível por contrato.
execution_policy:
  max_same_executor_reworks: 1
  max_upgrades: 1
  max_total_execution_attempts: 3

# Recomendações de roteamento por tipo de trabalho. É a entrada declarativa do
# Planner: ele escolhe aqui os slots concretos e os PERSISTE na task, que passa a
# ser o contrato. Estas entradas são recomendações do projeto, nunca decisões
# fixas de código — troque livremente os modelos abaixo.
#
# Slots:
#   default                     preferência normal
#   alt1 / alt2                 alternativas LATERAIS (indisponibilidade, custo,
#                               rate limit, provedor, especialização, preferência
#                               humana) — não são uma escada de retry
#   upgrade_alt1 / upgrade_alt2 escalada VERTICAL, só depois de esgotar rework ou
#                               quando a tarefa se revelou materialmente maior
# Effort permitido: default | low | high | max
work_routes:
  backend-implementation:
    executor:
      default: { model: deepseek-v4-pro, effort: high }
      alt1: { model: openai-gpt-5-6-terra, effort: high }
      alt2: { model: anthropic-sonnet-5, effort: high }
      upgrade_alt1: { model: openai-gpt-5-6-sol, effort: max }
      upgrade_alt2: { model: anthropic-opus-5, effort: max }
    tester:
      default: { model: openai-gpt-5-6-luna, effort: high }
      alt1: { model: google-gemini-3-7-flash, effort: high }
    reviewer:
      default: { model: anthropic-sonnet-5, effort: high }
      alt1: { model: openai-gpt-5-6-terra, effort: high }
      upgrade_alt1: { model: anthropic-opus-5, effort: max }

  frontend-implementation:
    executor:
      default: { model: anthropic-sonnet-5, effort: high }
      alt1: { model: openai-gpt-5-6-terra, effort: high }
      alt2: { model: google-gemini-3-7-flash, effort: high }
      upgrade_alt1: { model: openai-gpt-5-6-sol, effort: max }
      upgrade_alt2: { model: anthropic-opus-5, effort: max }
    tester:
      default: { model: openai-gpt-5-6-luna, effort: high }
      alt1: { model: anthropic-haiku-4-5, effort: high }
    reviewer:
      default: { model: openai-gpt-5-6-terra, effort: high }
      alt1: { model: anthropic-sonnet-5, effort: high }
      upgrade_alt1: { model: openai-gpt-5-6-sol, effort: max }

  test-authoring:
    executor:
      default: { model: openai-gpt-5-6-luna, effort: high }
      alt1: { model: xiaomi-mimo-v2-5, effort: high }
      alt2: { model: google-gemini-3-7-flash, effort: high }
      upgrade_alt1: { model: deepseek-v4-pro, effort: high }
      upgrade_alt2: { model: anthropic-sonnet-5, effort: high }
    reviewer:
      default: { model: anthropic-sonnet-5, effort: high }
      alt1: { model: openai-gpt-5-6-terra, effort: high }

  sql-migration:
    executor:
      default: { model: deepseek-v4-pro, effort: high }
      alt1: { model: anthropic-sonnet-5, effort: high }
      alt2: { model: openai-gpt-5-6-terra, effort: high }
      upgrade_alt1: { model: anthropic-opus-5, effort: max }
      upgrade_alt2: { model: openai-gpt-5-6-sol, effort: max }
    tester:
      default: { model: openai-gpt-5-6-luna, effort: high }
    reviewer:
      default: { model: anthropic-opus-5, effort: high }
      alt1: { model: openai-gpt-5-6-sol, effort: high }

  bugfix:
    executor:
      default: { model: openai-gpt-5-6-terra, effort: high }
      alt1: { model: deepseek-v4-pro, effort: high }
      alt2: { model: anthropic-sonnet-5, effort: high }
      upgrade_alt1: { model: openai-gpt-5-6-sol, effort: max }
      upgrade_alt2: { model: anthropic-opus-5, effort: max }
    tester:
      default: { model: openai-gpt-5-6-luna, effort: high }
    reviewer:
      default: { model: anthropic-sonnet-5, effort: high }

  refactor:
    executor:
      default: { model: anthropic-sonnet-5, effort: high }
      alt1: { model: deepseek-v4-pro, effort: high }
      alt2: { model: openai-gpt-5-6-terra, effort: high }
      upgrade_alt1: { model: anthropic-opus-5, effort: max }
      upgrade_alt2: { model: openai-gpt-5-6-sol, effort: max }
    tester:
      default: { model: openai-gpt-5-6-luna, effort: high }
    reviewer:
      default: { model: openai-gpt-5-6-terra, effort: high }

  documentation:
    executor:
      default: { model: anthropic-haiku-4-5, effort: default }
      alt1: { model: openai-gpt-5-6-luna, effort: default }
      alt2: { model: google-gemini-3-7-flash, effort: default }
      upgrade_alt1: { model: openai-gpt-5-6-terra, effort: high }
      upgrade_alt2: { model: anthropic-sonnet-5, effort: high }

  # Trabalho R3: executor frontier, revisor frontier de outro provedor.
  critical-implementation:
    executor:
      default: { model: openai-gpt-5-6-sol, effort: max }
      alt1: { model: anthropic-opus-5, effort: max }
      alt2: { model: deepseek-v4-pro, effort: max }
      upgrade_alt1: { model: anthropic-opus-5, effort: max }
      upgrade_alt2: { model: openai-gpt-5-6-sol, effort: max }
    tester:
      default: { model: openai-gpt-5-6-terra, effort: high }
      alt1: { model: deepseek-v4-pro, effort: high }
    reviewer:
      default: { model: anthropic-opus-5, effort: max }
      alt1: { model: deepseek-v4-pro, effort: max }
      upgrade_alt1: { model: anthropic-opus-5, effort: max }

  # Trabalho de planejamento: analise de requisito, escrita/decomposicao de task,
  # criterios de aceite, classificacao de risco e selecao de modelo.
  planning:
    executor:
      default: { model: anthropic-sonnet-5, effort: high }
      alt1: { model: openai-gpt-5-6-terra, effort: high }
      alt2: { model: deepseek-v4-pro, effort: high }
      upgrade_alt1: { model: anthropic-opus-5, effort: max }
      upgrade_alt2: { model: openai-gpt-5-6-sol, effort: max }

  system-design:
    executor:
      default: { model: anthropic-opus-5, effort: max }
      alt1: { model: openai-gpt-5-6-sol, effort: max }
      alt2: { model: anthropic-sonnet-5, effort: max }
      upgrade_alt1: { model: anthropic-opus-5, effort: max }
      upgrade_alt2: { model: openai-gpt-5-6-sol, effort: max }
    reviewer:
      default: { model: openai-gpt-5-6-sol, effort: max }
      alt1: { model: deepseek-v4-pro, effort: max }

# Runners de CLI para delegação de comandos via terminal.
# `argv` é a forma preferida: cada elemento vira UM argumento, sem shell no meio,
# portanto conteudo de task nunca pode virar comando. `command_template` continua
# aceito para compatibilidade com o schema 1, mas é uma string de shell.
#
# Placeholders (substituídos elemento a elemento): {prompt} {model} {effort}
# prompt_delivery: argv | file | stdin  (stdin/file são os mais seguros)
# provides: quais modelos/provedores este runner sabe executar — é isto que
#   desacopla modelo de CLI. Deixe vazio se o runner atende qualquer modelo.
# effort.supported: declare `true` SOMENTE se a CLI realmente aplica o esforço.
#   Declarar `true` sem suporte real quebra a garantia de identidade do R3.
# Use /lnx-configurar-roteamento para reconfigurar interativamente.
cli_runners:
  # Interfaces verificadas contra os binarios instalados em 2026-08-31 com
  # `--help`. Ao trocar de CLI ou de versao, confirme antes de editar: um
  # template errado trava a delegacao (modo interativo que nao retorna) ou
  # credita um effort que a CLI nao aplica.
  #
  # argv         modo nao interativo, uma tacada so (gate automatico)
  # interactive  sessao que continua aberta, para o Orchestrator conduzir
  # autonomy     auto-aprovacao de ferramentas. NUNCA entra no argv padrao:
  #              e opt-in por invocacao, porque desliga a confirmacao da
  #              propria CLI e contraria a regra do l-nexus de que comando
  #              destrutivo exige confirmacao humana. Evite em R3.
  codex:
    binary: "codex"
    # `codex exec ... -` le as instrucoes do stdin.
    argv: ["exec", "--model", "{model}", "-"]
    prompt_delivery: stdin
    interactive:
      # Sem subcomando as opcoes vao para a CLI interativa; PROMPT e posicional.
      supported: true
      argv: ["--model", "{model}", "{prompt}"]
    autonomy:
      supported: true
      argv: ["--dangerously-bypass-approvals-and-sandbox"]
    default_model: "gpt-5.6-sol"
    provides:
      providers: [openai]
      models: []
    effort:
      # Nao verificado nesta versao da CLI. Deixe false ate confirmar.
      supported: false
      argv: []
      mapping: {}
  claude:
    binary: "claude"
    argv: ["-p", "{prompt}", "--model", "{model}"]
    prompt_delivery: argv
    interactive:
      # Interativo por padrao; PROMPT e posicional.
      supported: true
      argv: ["--model", "{model}", "{prompt}"]
    autonomy:
      supported: true
      argv: ["--dangerously-skip-permissions"]
    default_model: "claude-sonnet-5"
    provides:
      providers: [anthropic]
      models: []
    effort:
      # `--effort low|medium|high|xhigh|max`
      supported: true
      argv: ["--effort", "{effort}"]
      mapping: { low: low, high: high, max: max }
  opencode:
    binary: "opencode"
    # O subcomando `run` e o modo nao interativo; sem ele a TUI abre e trava.
    argv: ["run", "--model", "{model}", "{prompt}"]
    prompt_delivery: argv
    interactive:
      # A TUI abre sem aceitar prompt inicial, entao nao da para conduzir por
      # send a partir da abertura. Use o modo `run`.
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: ["--auto"]
    default_model: "deepseek-v4-flash"
    provides:
      providers: []
      models: []
    effort:
      # `--variant` recebe a variante de raciocinio do provedor. O help cita
      # high, max e minimal; `low` fica fora do mapping porque nao ha
      # equivalente nomeado e adivinhar seria creditar esforco que nao existe.
      supported: true
      argv: ["--variant", "{effort}"]
      mapping: { high: high, max: max }
  agy:
    binary: "agy"
    # `--print` e obrigatorio: sem ele a sessao abre interativa e nao retorna.
    argv: ["--model", "{model}", "--print", "{prompt}"]
    prompt_delivery: argv
    interactive:
      # `-i` executa o prompt inicial e mantem a sessao aberta.
      supported: true
      argv: ["--model", "{model}", "-i", "{prompt}"]
    autonomy:
      supported: true
      argv: ["--dangerously-skip-permissions"]
    # Os ids desta CLI embutem o esforco no proprio nome do modelo
    # (ex.: `<familia>-high` / `-medium` / `-low`). Consulte `agy models`.
    default_model: "gemini-3.7-flash-high"
    provides:
      providers: [google]
      models: []
    effort:
      # `--effort low|medium|high`. Nao existe `max`, entao `max` fica fora do
      # mapping de proposito: creditar um esforco inexistente seria mentira.
      supported: true
      argv: ["--effort", "{effort}"]
      mapping: { low: low, high: high }
  qwen:
    binary: "qwen"
    argv: ["--model", "{model}", "--prompt", "{prompt}"]
    prompt_delivery: argv
    interactive:
      # `-i, --prompt-interactive`
      supported: true
      argv: ["--model", "{model}", "-i", "{prompt}"]
    autonomy:
      # Esta versao nao expoe nenhuma flag de aprovacao automatica. Declarar
      # uma inexistente faria a delegacao falhar na abertura.
      supported: false
      argv: []
    default_model: "qwen3.7-plus"
    provides:
      providers: [alibaba]
      models: []
    effort:
      supported: false
      argv: []
      mapping: {}
  kimi:
    binary: "kimi"
    argv: ["--model", "{model}", "--prompt", "{prompt}"]
    prompt_delivery: argv
    interactive:
      # Nao aceita prompt posicional; so `-c/--continue` retoma sessao.
      supported: false
      argv: []
    autonomy:
      supported: true
      argv: ["--yolo"]
    default_model: "kimi-k2-chat"
    provides:
      providers: []
      models: []
    effort:
      supported: false
      argv: []
      mapping: {}

# Adaptadores de terminal visível (Linux-first). `preference` é a ordem tentada
# quando o Orchestrator pede `--terminal auto`. `tmux` só é elegível dentro de
# uma sessão tmux. Se nada abrir, o l-nexus NÃO executa em background escondido:
# ele bloqueia com o motivo ou roda inline no terminal atual (fallback).
#
# Para um emulador fora da lista, use `custom` com `argv` e os placeholders
# {title} {cwd} {command} — o l-nexus repassa isso a `lnx-run.sh --terminal-cmd`.
terminal_runners:
  preference: [tmux, gnome-terminal, konsole, xfce4-terminal, kitty, alacritty, wezterm, tilix, terminator, x-terminal-emulator, xterm]
  fallback: inline
  hold: auto
  hold_seconds: 30
  adapters:
    custom:
      binary: ""
      argv: []
